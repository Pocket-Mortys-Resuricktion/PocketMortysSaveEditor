<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Mortys Save Editor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
:root{--green:#00ff9d;--green-dim:#00cc7a;--green-glow:rgba(0,255,157,.15);--bg:#050f09;--bg2:#080f0c;--panel:#0a1a12;--panel2:#0d2018;--border:#1a4030;--text:#b0ffd8;--text-dim:#4a8a6a;--warn:#ffb800;--red:#ff4466;--blue:#00ccff;--purple:#cc88ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;min-height:100vh;font-size:14px;background-image:radial-gradient(ellipse at 20% 10%,rgba(0,255,157,.04),transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(0,204,255,.03),transparent 50%)}
header{border-bottom:1px solid var(--border);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;color:var(--green);text-shadow:0 0 20px rgba(0,255,157,.5);letter-spacing:2px}
.logo span{display:block;color:var(--text-dim);font-weight:400;font-size:11px;letter-spacing:3px;margin-top:2px}
.container{max-width:1200px;margin:0 auto;padding:22px 20px}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:56px 32px;text-align:center;cursor:pointer;background:var(--panel);transition:.2s}
.upload-zone:hover,.upload-zone.drag{border-color:var(--green);background:var(--panel2)}
.upload-title{font-family:'Orbitron',sans-serif;font-size:18px;color:var(--green);margin-bottom:10px}
.upload-sub{color:var(--text-dim);line-height:1.8;font-size:13px}
#fileInput{display:none}
#editor{display:none}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{background:none;border:1px solid transparent;border-bottom:none;color:var(--text-dim);font:inherit;padding:9px 14px;cursor:pointer;border-radius:8px 8px 0 0;letter-spacing:.5px}
.tab:hover{color:var(--text)}.tab.active{color:var(--green);background:var(--panel);border-color:var(--border)}
.pane{display:none}.pane.active{display:block}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:16px}
.panel-h{background:var(--panel2);padding:10px 16px;border-bottom:1px solid var(--border);font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:2px;color:var(--green-dim);text-transform:uppercase;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h .sp{flex:1}
.panel-b{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.f label{display:block;font-size:10px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.f .row{display:flex;gap:6px;align-items:center}
input[type=number],input[type=text],select{background:var(--bg2);border:1px solid var(--border);color:var(--text);font:inherit;padding:7px 10px;border-radius:6px;width:100%;min-width:0}
input[type=number]:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--green)}
input.mod,select.mod{border-color:var(--warn)}
input[type=checkbox]{accent-color:var(--green);width:16px;height:16px}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);font:inherit;padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;letter-spacing:.5px}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.pri{background:var(--green);color:#012;border-color:var(--green);font-weight:700}
.btn.pri:hover{box-shadow:0 0 22px rgba(0,255,157,.5);color:#012}
.btn.warn{color:var(--warn);border-color:rgba(255,184,0,.4)}
.btn.danger{color:var(--red);border-color:rgba(255,68,102,.4)}
.btn.sm{padding:3px 8px;font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{color:var(--text-dim);font-size:12px;line-height:1.7}
.note b,.note code{color:var(--text)}
code{background:var(--bg2);padding:1px 5px;border-radius:4px;color:var(--green-dim)}
.banner{border:1px solid rgba(255,184,0,.35);background:rgba(255,184,0,.08);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;line-height:1.7}
.banner.ok{border-color:rgba(0,255,157,.35);background:rgba(0,255,157,.07);color:var(--green)}
.banner.err{border-color:rgba(255,68,102,.4);background:rgba(255,68,102,.08);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--text-dim);font-weight:400;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel)}
td{padding:5px 8px;border-bottom:1px solid rgba(26,64,48,.5);vertical-align:middle}
tr.row:hover td{background:rgba(0,255,157,.05)}
tr.sel td{background:rgba(0,204,255,.08)}
tr.bad td.flag{color:var(--warn)}
.ed td{background:var(--bg2);padding:12px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:2px 4px 2px 10px;margin:2px;font-size:12px}
.chip button{background:none;border:none;color:var(--red);cursor:pointer;font:inherit}
.tag{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid var(--border);color:var(--text-dim)}
.tag.shiny{color:var(--warn);border-color:rgba(255,184,0,.4)}.tag.bad{color:var(--warn);border-color:rgba(255,184,0,.4)}.tag.good{color:var(--green)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.dex .c{border:1px solid var(--border);border-radius:6px;padding:5px 8px;cursor:pointer;background:var(--bg2);font-size:12px;line-height:1.4;user-select:none}
.dex .c.seen{border-color:var(--blue);color:var(--blue)}.dex .c.caught{border-color:var(--green);color:var(--green);background:rgba(0,255,157,.07)}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.toast{position:fixed;bottom:22px;right:22px;background:var(--panel2);border:1px solid var(--green);color:var(--green);padding:11px 18px;border-radius:8px;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;z-index:50;max-width:420px}
.toast.show{opacity:1;transform:none}.toast.err{border-color:var(--red);color:var(--red)}
.status{font-size:12px;color:var(--text-dim);text-align:right}
.status b{color:var(--green)}
pre{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px;overflow:auto;font-size:12px;line-height:1.6;white-space:pre-wrap}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin:12px 0}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.op{border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--bg2)}
.op label.t{display:flex;gap:8px;align-items:center;color:var(--text);font-size:12px;margin-bottom:6px;cursor:pointer}
.sub{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sub .btn.on{border-color:var(--green);color:var(--green)}
.trow{display:flex;gap:8px;align-items:center;margin:3px 0}
.trow .tl{min-width:200px;color:var(--text-dim);font-size:12px;word-break:break-all}
.trow input[type=text],.trow input[type=number]{max-width:380px}
.tnode{margin:3px 0}.tnode>summary{cursor:pointer;padding:3px 0;list-style:none}.tnode>summary::before{content:'▸ ';color:var(--green-dim)}.tnode[open]>summary::before{content:'▾ '}
.tbody{margin-left:18px;border-left:1px solid var(--border);padding-left:12px}

</style>
</head>
<body>
<header>
  <div class="logo">POCKET MORTYS<span>SAVE EDITOR · Player.dat / CloudContainer.dat</span></div>
  <div class="btns"><span class="status" id="status"></span><button class="btn pri" id="dl">⬇ Download</button><button class="btn" id="another">Load another</button></div>
</header>
<div class="container">
  <div id="upload">
    <div class="upload-zone" id="drop"><div class="upload-title">DROP YOUR Player.dat HERE</div>
      <div class="upload-sub">or click to choose a file · <code>Player.dat</code> or <code>CloudContainer.dat</code> from the game's <code>files</code> folder<br>Everything stays in your browser — nothing is uploaded.</div></div>
    <input type="file" id="fileInput">
    <div class="btns" style="justify-content:center;margin-top:16px"><button class="btn" id="startEmpty">✨ Start with an empty save <span class="tag">experimental</span></button></div>
  </div>
  <div id="editor"><div id="loadMsg"></div><div class="tabs" id="tabs"></div><div id="panes"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
// ── nrbf.js ──
// Minimal MS-NRBF (.NET BinaryFormatter) reader/writer with byte-exact round-tripping.
(function (root) {
'use strict';
const NULL = { k: 'null' };
const PT = { BOOL:1, BYTE:2, CHAR:3, DECIMAL:5, DOUBLE:6, I16:7, I32:8, I64:9, SBYTE:10, SINGLE:11, TIMESPAN:12, DATETIME:13, U16:14, U32:15, U64:16, STRING:18 };

class Reader {
  constructor(buf) { this.b = buf; this.p = 0; this.dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength); }
  u8() { return this.b[this.p++]; }
  i32() { const v = this.dv.getInt32(this.p, true); this.p += 4; return v; }
  lps() {
    let len = 0, shift = 0, c;
    do { c = this.u8(); len |= (c & 0x7f) << shift; shift += 7; } while (c & 0x80);
    const s = new TextDecoder().decode(this.b.subarray(this.p, this.p + len)); this.p += len; return s;
  }
  prim(t) {
    const dv = this.dv, p = this.p; let v;
    switch (t) {
      case PT.BOOL: v = this.b[p] !== 0; this.p += 1; break;
      case PT.BYTE: v = this.b[p]; this.p += 1; break;
      case PT.SBYTE: v = dv.getInt8(p); this.p += 1; break;
      case PT.CHAR: { // UTF-8 char
        const c = this.b[p]; const n = c < 0x80 ? 1 : c < 0xE0 ? 2 : c < 0xF0 ? 3 : 4;
        v = new TextDecoder().decode(this.b.subarray(p, p + n)); this.p += n; break; }
      case PT.DECIMAL: v = this.lps(); break;
      case PT.DOUBLE: v = dv.getFloat64(p, true); this.p += 8; break;
      case PT.SINGLE: v = dv.getFloat32(p, true); this.p += 4; break;
      case PT.I16: v = dv.getInt16(p, true); this.p += 2; break;
      case PT.U16: v = dv.getUint16(p, true); this.p += 2; break;
      case PT.I32: v = dv.getInt32(p, true); this.p += 4; break;
      case PT.U32: v = dv.getUint32(p, true); this.p += 4; break;
      case PT.I64: case PT.TIMESPAN: v = dv.getBigInt64(p, true); this.p += 8; break;
      case PT.U64: case PT.DATETIME: v = dv.getBigUint64(p, true); this.p += 8; break;
      case PT.STRING: v = this.lps(); break;
      default: throw new Error('bad prim type ' + t + ' @' + p);
    }
    return v;
  }
}

class Writer {
  constructor() { this.a = new Uint8Array(1 << 16); this.p = 0; this.dv = new DataView(this.a.buffer); }
  need(n) { if (this.p + n > this.a.length) { const na = new Uint8Array(Math.max(this.a.length * 2, this.p + n)); na.set(this.a); this.a = na; this.dv = new DataView(na.buffer); } }
  u8(v) { this.need(1); this.a[this.p++] = v; }
  i32(v) { this.need(4); this.dv.setInt32(this.p, v, true); this.p += 4; }
  lps(s) {
    const e = new TextEncoder().encode(s); let n = e.length;
    this.need(n + 5);
    do { let c = n & 0x7f; n >>>= 7; if (n) c |= 0x80; this.a[this.p++] = c; } while (n);
    this.a.set(e, this.p); this.p += e.length;
  }
  prim(t, v) {
    this.need(16); const dv = this.dv;
    switch (t) {
      case PT.BOOL: this.a[this.p++] = v ? 1 : 0; break;
      case PT.BYTE: this.a[this.p++] = v; break;
      case PT.SBYTE: dv.setInt8(this.p, v); this.p += 1; break;
      case PT.CHAR: { const e = new TextEncoder().encode(v); this.need(e.length); this.a.set(e, this.p); this.p += e.length; break; }
      case PT.DECIMAL: case PT.STRING: this.lps(v); break;
      case PT.DOUBLE: dv.setFloat64(this.p, v, true); this.p += 8; break;
      case PT.SINGLE: dv.setFloat32(this.p, v, true); this.p += 4; break;
      case PT.I16: dv.setInt16(this.p, v, true); this.p += 2; break;
      case PT.U16: dv.setUint16(this.p, v, true); this.p += 2; break;
      case PT.I32: dv.setInt32(this.p, v, true); this.p += 4; break;
      case PT.U32: dv.setUint32(this.p, v, true); this.p += 4; break;
      case PT.I64: case PT.TIMESPAN: dv.setBigInt64(this.p, BigInt(v), true); this.p += 8; break;
      case PT.U64: case PT.DATETIME: dv.setBigUint64(this.p, BigInt(v), true); this.p += 8; break;
      default: throw new Error('bad prim type ' + t);
    }
  }
  out() { return this.a.slice(0, this.p); }
}

function parse(buf) {
  const r = new Reader(buf);
  const byId = new Map(), libs = new Map(), metas = new Map();
  const doc = { byId, libs, root: null, header: null, dups: [] };
  function setObj(o) { if (byId.has(o.id)) doc.dups.push(o.id); byId.set(o.id, o); }
  doc.setObj = setObj;

  function readTypeInfo(n) {
    const bts = [], ex = [];
    for (let i = 0; i < n; i++) bts.push(r.u8());
    for (let i = 0; i < n; i++) {
      const bt = bts[i];
      if (bt === 0 || bt === 7) ex.push(r.u8());
      else if (bt === 3) ex.push(r.lps());
      else if (bt === 4) { const nm = r.lps(); ex.push({ name: nm, lib: r.i32() }); }
      else ex.push(null);
    }
    return bts.map((bt, i) => ({ bt, ex: ex[i] }));
  }

  // Read one record at the current position (after reading record type byte if pre-read rt provided)
  function readRecord(preRt) {
    let rt = preRt === undefined ? r.u8() : preRt;
    while (rt === 12) { const id = r.i32(); const name = r.lps(); libs.set(id, name); rt = r.u8(); }
    switch (rt) {
      case 9: return { k: 'ref', id: r.i32() };
      case 10: return NULL;
      case 13: return { k: 'nullrun', n: r.u8(), w: 1 };
      case 14: return { k: 'nullrun', n: r.i32(), w: 4 };
      case 6: { const o = { k: 'str', id: r.i32(), v: null }; o.v = r.lps(); setObj(o); return o; }
      case 8: { const t = r.u8(); return { k: 'prim', t, v: r.prim(t) }; }
      case 1: case 2: case 3: case 4: case 5: return readClass(rt);
      case 7: return readBinArray();
      case 15: { const o = { k: 'arr', rt, id: r.i32() }; const len = r.i32(); o.t = r.u8(); o.vals = []; for (let i = 0; i < len; i++) o.vals.push(r.prim(o.t)); setObj(o); return o; }
      case 16: case 17: { const o = { k: 'arr', rt, id: r.i32() }; const len = r.i32(); o.vals = readElems(len); setObj(o); return o; }
      default: throw new Error('unknown record type ' + rt + ' @' + (r.p - 1));
    }
  }
  function readElems(len) {
    const out = [];
    while (out.length < len) {
      const e = readRecord();
      if (e.k === 'nullrun') { for (let i = 0; i < e.n; i++) out.push(NULL); }
      else out.push(e);
    }
    return out;
  }
  function readBinArray() {
    const o = { k: 'arr', rt: 7, id: r.i32() };
    o.atype = r.u8(); const rank = r.i32(); o.lens = []; for (let i = 0; i < rank; i++) o.lens.push(r.i32());
    if (o.atype >= 3) { o.lows = []; for (let i = 0; i < rank; i++) o.lows.push(r.i32()); }
    o.bt = r.u8(); o.ex = (o.bt === 0 || o.bt === 7) ? r.u8() : o.bt === 3 ? r.lps() : o.bt === 4 ? { name: r.lps(), lib: r.i32() } : null;
    const total = o.lens.reduce((a, b) => a * b, 1);
    o.vals = [];
    if (o.bt === 0) { for (let i = 0; i < total; i++) o.vals.push(r.prim(o.ex)); }
    else o.vals = readElems(total);
    setObj(o); return o;
  }
  function readClass(rt) {
    const o = { k: 'cls', rt };
    if (rt === 1) {
      o.id = r.i32(); o.metaId = r.i32();
      const m = metas.get(o.metaId); if (!m) throw new Error('missing meta ' + o.metaId);
      o.meta = m.meta; o.name = m.name; o.names = m.names; o.types = m.types; o.libId = m.libId;
    } else {
      o.id = r.i32(); o.name = r.lps(); const n = r.i32(); o.names = []; for (let i = 0; i < n; i++) o.names.push(r.lps());
      if (rt === 2 || rt === 3) throw new Error('ClassWithMembers w/o types unsupported');
      o.types = readTypeInfo(n);
      if (rt === 5) o.libId = r.i32();
      o.meta = o; metas.set(o.id, o);
    }
    o.vals = [];
    for (let i = 0; i < o.names.length; i++) {
      const ti = o.types[i];
      if (ti.bt === 0) o.vals.push(r.prim(ti.ex));
      else {
        const e = readRecord();
        if (e.k === 'nullrun') { o.runs = o.runs || []; o.runs.push([o.vals.length, e.n, e.w]); for (let j = 0; j < e.n; j++) { o.vals.push(NULL); i++; } i--; }
        else o.vals.push(e);
      }
    }
    setObj(o);
    return o;
  }

  let rt = r.u8();
  if (rt !== 0) throw new Error('not an NRBF stream');
  doc.header = { rootId: r.i32(), headerId: r.i32(), major: r.i32(), minor: r.i32() };
  const records = [];
  while (true) {
    const x = r.u8();
    if (x === 11) break;
    records.push(readRecord(x));
  }
  doc.records = records;
  doc.root = byId.get(doc.header.rootId);
  return doc;
}

function write(doc) {
  const w = new Writer();
  const libsWritten = new Set();
  const h = doc.header;
  w.u8(0); w.i32(h.rootId); w.i32(h.headerId); w.i32(h.major); w.i32(h.minor);

  function writeNullRun(n, wd) {
    if (n === 1) w.u8(10);
    else if (wd === 4 || n > 255) { w.u8(14); w.i32(n); }
    else { w.u8(13); w.u8(n); }
  }
  function writeElems(vals) {
    let i = 0;
    while (i < vals.length) {
      if (vals[i] === NULL) {
        let j = i; while (j < vals.length && vals[j] === NULL) j++;
        const n = j - i; const run = (vals.runs || []).find(r => r[0] === i && r[1] === n); writeNullRun(n, run ? run[2] : 1); i = j;
      } else { writeRecord(vals[i]); i++; }
    }
  }
  function writeTypeEx(bt, ex) {
    if (bt === 0 || bt === 7) w.u8(ex); else if (bt === 3) w.lps(ex); else if (bt === 4) { w.lps(ex.name); w.i32(ex.lib); }
  }
  function ensureLib(id) { if (id !== undefined && !libsWritten.has(id)) { libsWritten.add(id); w.u8(12); w.i32(id); w.lps(doc.libs.get(id)); } }
  function writeRecord(o) {
    switch (o.k) {
      case 'ref': w.u8(9); w.i32(o.id); return;
      case 'null': w.u8(10); return;
      case 'prim': w.u8(8); w.u8(o.t); w.prim(o.t, o.v); return;
      case 'str': w.u8(6); w.i32(o.id); w.lps(o.v); return;
      case 'cls': writeClass(o); return;
      case 'arr': writeArray(o); return;
      default: throw new Error('cannot write ' + o.k);
    }
  }
  function writeArray(o) {
    if (o.rt === 15) { w.u8(15); w.i32(o.id); w.i32(o.vals.length); w.u8(o.t); for (const v of o.vals) w.prim(o.t, v); }
    else if (o.rt === 16 || o.rt === 17) { w.u8(o.rt); w.i32(o.id); w.i32(o.vals.length); writeElems(o.vals); }
    else {
      w.u8(7); w.i32(o.id); w.u8(o.atype); w.i32(o.lens.length); for (const l of o.lens) w.i32(l);
      if (o.atype >= 3) for (const l of o.lows) w.i32(l);
      w.u8(o.bt); writeTypeEx(o.bt, o.ex);
      if (o.bt === 0) for (const v of o.vals) w.prim(o.ex, v); else writeElems(o.vals);
    }
  }
  const metaWritten = new Map();
  function writeClass(o) {
    const meta = o.meta;
    if (metaWritten.has(meta)) { w.u8(1); w.i32(o.id); w.i32(metaWritten.get(meta)); }
    else {
      metaWritten.set(meta, o.id);
      const rt = meta.rt === 1 ? 5 : meta.rt;
      if (rt === 3 || rt === 5) ensureLib(meta.libId);
      w.u8(rt); w.i32(o.id); w.lps(meta.name); w.i32(meta.names.length); for (const n of meta.names) w.lps(n);
      for (const t of meta.types) w.u8(t.bt);

// ── app_core.js ──
// ════════════ Pocket Mortys Save Editor — UI ════════════
const { Save, calcStats, EV_MODES } = PMSave;
const NR = NRBF;
let S = null, fileName = 'Player.dat', isContainer = false, changes = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const INT_MAX = 2147483647;
function toast(msg, err) { const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', err ? 5000 : 2600); }
function touch() { changes++; $('status').innerHTML = `<b>${esc(fileName)}</b> · ${changes} edit${changes === 1 ? '' : 's'} not yet downloaded`; }
const mortyName = id => MORTY_NAMES[id] || (id ? id.replace(/^Morty/, '').replace(/([A-Z][a-z]+)/g, ' $1').trim() + ' Morty' : '?');
const prettify = id => String(id || '').replace(/^(Item|Attack|Avatar|Quest|Trainer)/, '').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2');
const AVATAR_BY_ID = Object.fromEntries(AVATAR_DATA.map(a => [a[0], a]));
const ITEM_BY_ID = Object.fromEntries(ITEM_CATALOG.map(e => [e[0], e]));
const ALL_MORTY_IDS = Object.keys(MORTY_INFO).sort((a, b) => MORTY_INFO[a][0] - MORTY_INFO[b][0] || a.localeCompare(b));

// ── file handling ──
function handleFile(file) {
  const r = new FileReader();
  r.onload = () => loadBytes(new Uint8Array(r.result), file.name);
  r.readAsArrayBuffer(file);
}
function b64bytes(s) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function loadBytes(bytes, name, note) {
  try {
    S = new Save(bytes);
    fileName = name; changes = 0; sel.clear(); resetMortyView();
    $('upload').style.display = 'none'; $('editor').style.display = 'block';
    $('status').innerHTML = `<b>${esc(fileName)}</b> loaded · ${(bytes.length / 1024).toFixed(0)} KB`;
    let msg = note ? `<div class="banner">${note}</div>` : '';
    if (S.notes.length) msg += `<div class="banner ok">Note: ${S.notes.length} list(s) have a size larger than their backing array (e.g. the Badges list, from a memory-editor). The game tolerates this, so they are left exactly as they are unless you edit that list.</div>`;
    $('loadMsg').innerHTML = msg;
    switchTab(currentTab || 'overview');
  } catch (e) { console.error(e); toast('Could not read file: ' + e.message, true); }
}
function startEmpty() {
  loadBytes(b64bytes(EMPTY_SAVE_B64), 'Player.dat', '<b>Experimental:</b> new empty save (1 level-1 starter Morty, no items, no progress). It is built from a real save with everything cleared, but it has never been tested in the game. Fresh-save defaults (slot cap, starting flags) are best guesses. Keep a backup of anything you care about.');
}

}

  const r = S.res(raw);
  if (r === NR.NULL || r === undefined || r === null) return `<div class="trow"><span class="tl">${esc(label)}</span><span class="note">null</span>${extra}</div>`;
  if (r.k === 'str') { const k = reg(s => { setter(NR.mkStr(S.doc, s)); touch(); }); return `<div class="trow"><span class="tl">${esc(label)}</span><input type="text" data-r="${k}" value="${esc(r.v)}">${extra}</div>`; }
  if (r.k === 'prim') return `<div class="trow"><span class="tl">${esc(label)}</span>${primInput(r.t, r.v, v => { r.v = v; })}${extra}</div>`;
  const k = reg(r);
  const short = r.k === 'cls' ? r.name.replace(/System\.Collections\.Generic\./, '').replace(/, mscorlib[^\]]*/g, '').replace(/, Assembly-CSharp[^\]]*/g, '').slice(0, 70) : `array[${r.vals.length}]`;
  let cnt = ''; if (r.k === 'cls' && /List`1/.test(r.name)) cnt = ` · ${r.vals[1]} item${r.vals[1] === 1 ? '' : 's'}`; else if (r.k === 'cls' && /Dictionary`2/.test(r.name)) cnt = ` · ${S.dictPairs(r).length} entries`;
  return `<details class="tnode" data-n="${k}"><summary><span class="tl">${esc(label)}</span> <span class="note">${esc(short)}${cnt}</span>${extra}</summary><div class="tbody"></div></details>`;
}
function nodeBody(r) {
  if (r.k === 'cls' && /System\.Collections\.Generic\.List`1/.test(r.name)) {
    const items = S.listItems(r), arr = S.arrOf(r), prim = arr.rt === 15 || (arr.rt === 7 && arr.bt === 0);
    const kind = prim ? 'prim' : (items.length && items.every(x => x && x.k === 'str')) || (arr.rt === 17) ? 'str' : 'obj';
    let h = items.map((it, i) => nodeRow(`[${i}]`, it, prim ? { bt: 0, ex: arr.t !== undefined ? arr.t : arr.ex } : null, v => { const a = S.listItems(r); a[i] = v; S.listSet(r, typeof v === 'object' && v.k === 'str' ? a.map(x => x && x.k === 'str' ? x.v : x) : a); },
      `<button class="btn sm danger" data-rm="${reg(() => { const a = S.listItems(r); a.splice(i, 1); S.listSet(r, a.map(x => x && x.k === 'str' ? x.v : x)); touch(); })}">✕</button>`)).join('');
    if (kind !== 'obj') { const k = reg(s => { const a = S.listItems(r).map(x => x && x.k === 'str' ? x.v : x); const v = kind === 'str' ? s : parsePrim(arr.t !== undefined ? arr.t : arr.ex, s); if (v === null) return toast('Invalid', true); a.push(v); S.listSet(r, a); touch(); }); h += `<div class="trow"><input type="text" id="add${k}" placeholder="new item"><button class="btn sm" data-add="${k}">+ add</button></div>`; }
    return h || '<span class="note">empty</span>';
  }
  if (r.k === 'cls' && /Dictionary`2/.test(r.name)) {
    return S.dictPairs(r).map(p => nodeRow(S.sv(p.vals[0]), p.vals[1], p.types[1], v => { p.vals[1] = v; })).join('') || '<span class="note">empty</span>';
  }
  if (r.k === 'cls') return r.names.map((n, i) => nodeRow(n, r.vals[i], r.types[i], v => { r.vals[i] = v; })).join('') || '<span class="note">(no fields)</span>';
  if (r.k === 'arr') return r.vals.slice(0, 200).map((v, i) => nodeRow(`[${i}]`, v, (r.rt === 15 || (r.rt === 7 && r.bt === 0)) ? { bt: 0, ex: r.t !== undefined ? r.t : r.ex } : null, x => { r.vals[i] = x; })).join('');
  return '';
}
RENDER.advanced = () => {
  REG = [];
  $('pane-advanced').innerHTML = `<div class="panel"><div class="panel-h">🔧 Raw save tree <span class="sp"></span><span class="note">every field in the file — expand a node to edit it</span></div><div class="panel-b"><div class="banner">Edits here bypass all safety checks. Changing a list's contents is safe (sizes are kept in sync); changing type-specific fields to nonsense can make the game reject the save.</div>
   <div id="tree">${S.root.names.map((n, i) => nodeRow(n, S.root.vals[i], S.root.types[i], v => { S.root.vals[i] = v; })).join('')}</div></div></div>`;
  const P = $('tree');
  P.addEventListener('toggle', e => { const d = e.target; if (!d.open || d.dataset.done) return; d.dataset.done = 1; const r = REG[+d.dataset.n]; d.querySelector('.tbody').innerHTML = nodeBody(r); }, true);
  P.onchange = e => { const t = e.target; if (t.dataset.r === undefined) return; REG[+t.dataset.r](t.dataset.kind === 'bool' ? t.checked : t.value); t.classList.add('mod'); };
  P.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.rm !== undefined) { REG[+b.dataset.rm](); const d = b.closest('details.tnode'); if (d) { d.dataset.done = ''; d.querySelector('.tbody').innerHTML = nodeBody(REG[+d.dataset.n]); } }
    if (b.dataset.add !== undefined) { REG[+b.dataset.add]($('add' + b.dataset.add).value); const d = b.closest('details.tnode'); d.querySelector('.tbody').innerHTML = nodeBody(REG[+d.dataset.n]); }
  };
};

// ════════ Output verification + download ════════
function verifyBytes(bytes) {
  const probs = []; let d;
  try { d = NR.parse(bytes); } catch (e) { return ['output does not parse: ' + e.message]; }
  if (d.dups.length) probs.push('duplicate object ids');
  for (const o of d.byId.values()) {
    if (o.k === 'cls' && /^System\.Collections\.Generic\.List`1/.test(o.name)) {
      const a = NR.resolve(d, o.vals[0]); if (!a || a === NR.NULL || !a.vals) continue;
      if (o.vals[1] < 0) probs.push('list #' + o.id + ' negative size');
    }
  }
  const s2 = new Save(bytes);
  return { probs, s2 };
}
function download() {
  if (!S) return;
  try {
    const out = S.write(); const v = verifyBytes(out);
    if (Array.isArray(v) || v.probs.length) { toast('Self-check failed: ' + (Array.isArray(v) ? v : v.probs).join('; '), true); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'application/octet-stream' })); a.download = fileName; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    changes = 0; $('status').innerHTML = `<b>${esc(fileName)}</b> downloaded (${(out.length / 1024).toFixed(0)} KB, self-check passed)`;
    toast('Downloaded — see the Save & Install tab for how to put it in the game.');
  } catch (e) { console.error(e); toast('Could not build file: ' + e.message, true); }
}

// ════════ Deploy ════════
RENDER.deploy = () => {
  $('pane-deploy').innerHTML = `<div class="panel"><div class="panel-h">📲 Getting the edited save into the game</div><div class="panel-b">
  <div class="btns" style="margin-bottom:14px"><button class="btn pri" id="dl2">⬇ Download ${esc(fileName)}</button></div>
  <ol class="note" style="line-height:2;padding-left:20px">
   <li>Close the game completely.</li>
   <li>Put the downloaded <code>${esc(fileName)}</code> in the game's <code>files</code> folder, replacing the existing one. Make it the <b>newest</b> copy: the game loads <code>Player.dat</code> from whichever of the internal (<code>/data/data/&lt;package&gt;/files</code>) or external (<code>Android/data/&lt;package&gt;/files</code>) folders has the newer one.</li>
   <li><b>Delete <code>CloudContainer.dat</code></b> in the same folder (and any copy in the other location). The game keeps a full backup of the save in it and, at start-up, re-extracts that backup over <code>Player.dat</code>. A stale container silently undoes your edit; without it the game rebuilds one from your edited file.</li>
   <li>Start the game offline (or signed out of Google Play Games). If you are signed in and the cloud copy differs, the game shows a conflict picker — choose the entry whose Schmeckles/Badges match your edit.</li>
  </ol>
  <div class="note" style="margin-top:10px">Alternatively load <code>CloudContainer.dat</code> into this editor instead: it edits the player inside the container, so nothing gets overwritten.</div>
  <div class="note" style="margin-top:10px">Based on the 2.0.3 source (<code>SaveDataController</code>); the 2.40.2 build has not been re-verified for this flow. Always keep a backup of the original file.</div></div></div>`;
  $('dl2').onclick = download;
};

// ════════ Init ════════
function init() {
  buildTabs();
  const dz = $('drop'), fi = $('fileInput');
  dz.onclick = () => fi.click();
  $('startEmpty').onclick = e => { e.stopPropagation(); startEmpty(); };
  fi.onchange = e => { if (e.target.files[0]) handleFile(e.target.files[0]); };
  ['dragover', 'dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e => { if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  $('dl').onclick = download;
  $('another').onclick = () => { if (!changes || confirm('Discard unsaved edits and load another file?')) { S = null; $('editor').style.display = 'none'; $('upload').style.display = 'block'; $('status').textContent = ''; fi.value = ''; } };
}
window.addEventListener('beforeunload', e => { if (S && changes) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('DOMContentLoaded', init);

</script>
